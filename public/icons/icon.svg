<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer radar pulse rings -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="#ef4444" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="10 10" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M 256 90 L 370 140 C 370 250 256 340 256 360 C 256 340 142 250 142 140 Z" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Japanese "絆" Kanji stylized or Emergency beacon symbol -->
  <!-- Stylized Kizuna emblem inside shield -->
  <g fill="#ffffff">
    <!-- Center white core alert flame / mountain beacon -->
    <path d="M 256 145 C 248 180 220 215 220 245 C 220 270 236 288 256 288 C 276 288 292 270 292 245 C 292 215 264 180 256 145 Z" fill="#ffffff" />
    <!-- Heart / Connection loop -->
    <circle cx="256" cy="235" r="16" fill="#dc2626" />
    <!-- Sound / Radio waves -->
    <path d="M 200 200 A 70 70 0 0 0 200 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <path d="M 312 200 A 70 70 0 0 1 312 280" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Badge banner: KIZUNA ALERT -->
  <rect x="96" y="390" width="320" height="58" rx="29" fill="#1e293b" stroke="#ef4444" stroke-width="3" />
  <text x="256" y="428" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">KIZUNA ALERT</text>
</svg>
