<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Outer Border -->
  <rect x="5" y="5" width="590" height="390" rx="15" fill="#059669" stroke="#ffffff" stroke-width="8" />
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="550" height="70" rx="8" fill="#ffffff" />
  <text x="300" y="70" font-family="'Hiragino Sans', 'Meiryo', 'Noto Sans JP', sans-serif" font-weight="900" font-size="38" fill="#047857" text-anchor="middle">津波避難ビル</text>
  
  <!-- Subtitle in English -->
  <text x="300" y="118" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">TSUNAMI EVACUATION BUILDING</text>

  <!-- Left graphic: Evacuation pictogram -->
  <rect x="40" y="140" width="180" height="180" rx="12" fill="#ffffff" />
  <!-- Wave graphic -->
  <path d="M 50 280 Q 90 220, 130 250 T 210 240 L 210 310 L 50 310 Z" fill="#0284c7" />
  <path d="M 50 295 Q 100 240, 150 270 T 210 260 L 210 310 L 50 310 Z" fill="#0369a1" />
  <!-- Person running up stairs -->
  <path d="M 80 230 L 110 230 L 110 200 L 140 200 L 140 170 L 170 170" fill="none" stroke="#059669" stroke-width="8" />
  <!-- Person icon -->
  <circle cx="160" cy="155" r="10" fill="#059669" />
  <path d="M 160 167 L 160 185 L 175 198 M 160 175 L 148 185" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" />

  <!-- Right Details -->
  <g fill="#ffffff">
    <rect x="240" y="140" width="320" height="52" rx="8" fill="#047857" stroke="#ffffff" stroke-width="2" />
    <text x="400" y="175" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">収容階： 3階以上 (屋上)</text>

    <rect x="240" y="204" width="320" height="52" rx="8" fill="#047857" stroke="#ffffff" stroke-width="2" />
    <text x="400" y="239" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-weight="bold" font-size="22" text-anchor="middle">海抜標高： 18.5 m</text>

    <rect x="240" y="268" width="320" height="52" rx="8" fill="#f59e0b" />
    <text x="400" y="303" font-family="'Hiragino Sans', 'Meiryo', sans-serif" font-weight="900" font-size="21" fill="#78350f" text-anchor="middle">ここから 180m 先</text>
  </g>

  <!-- Footer Notice -->
  <text x="300" y="365" font-family="'Hiragino Sans', sans-serif" font-size="16" fill="#ecfdf5" text-anchor="middle">沖縄県恩納村防災対策本部 / Onna Village Disaster Prevention HQ</text>
</svg>
